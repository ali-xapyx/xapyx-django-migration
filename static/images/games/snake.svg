<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="snk-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04140e"/>
      <stop offset="100%" stop-color="#0a261c"/>
    </linearGradient>
    <filter id="snk-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="220" fill="url(#snk-bg)"/>
  <!-- Matrix Grid -->
  <g stroke="rgba(16,185,129,0.12)" stroke-width="1">
    <line x1="0" y1="30" x2="400" y2="30"/><line x1="0" y1="60" x2="400" y2="60"/>
    <line x1="0" y1="90" x2="400" y2="90"/><line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="150" x2="400" y2="150"/><line x1="0" y1="180" x2="400" y2="180"/>
    <line x1="40" y1="0" x2="40" y2="220"/><line x1="80" y1="0" x2="80" y2="220"/>
    <line x1="120" y1="0" x2="120" y2="220"/><line x1="160" y1="0" x2="160" y2="220"/>
    <line x1="200" y1="0" x2="200" y2="220"/><line x1="240" y1="0" x2="240" y2="220"/>
    <line x1="280" y1="0" x2="280" y2="220"/><line x1="320" y1="0" x2="320" y2="220"/>
    <line x1="360" y1="0" x2="360" y2="220"/>
  </g>
  <!-- Glowing Neon Serpent -->
  <g filter="url(#snk-glow)" fill="#10b981" stroke="#34d399" stroke-width="2">
    <!-- Body segments (rounded curve) -->
    <rect x="60" y="140" width="24" height="24" rx="8" opacity="0.6"/>
    <rect x="90" y="140" width="24" height="24" rx="8" opacity="0.7"/>
    <rect x="120" y="140" width="24" height="24" rx="8" opacity="0.8"/>
    <rect x="120" y="110" width="24" height="24" rx="8" opacity="0.85"/>
    <rect x="120" y="80" width="24" height="24" rx="8" opacity="0.9"/>
    <rect x="150" y="80" width="24" height="24" rx="8" opacity="0.95"/>
    <rect x="180" y="80" width="24" height="24" rx="8"/>
    <rect x="210" y="80" width="24" height="24" rx="8"/>
    <rect x="240" y="80" width="24" height="24" rx="8"/>
    <rect x="240" y="110" width="24" height="24" rx="8"/>
    <!-- Head -->
    <rect x="270" y="110" width="28" height="26" rx="9" fill="#34d399" stroke="#a7f3d0" stroke-width="2.5"/>
    <!-- Eyes -->
    <circle cx="288" cy="117" r="3" fill="#04140e"/>
    <circle cx="289" cy="116" r="1" fill="#fff"/>
    <!-- Tongue -->
    <path d="M 298,123 L 308,123 M 308,123 L 314,119 M 308,123 L 314,127" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Glowing Apple Food -->
  <g transform="translate(340, 122)" filter="url(#snk-glow)">
    <circle cx="0" cy="0" r="14" fill="#f43f5e" stroke="#fb7185" stroke-width="2"/>
    <ellipse cx="-4" cy="-4" rx="3" ry="2" fill="#fff" opacity="0.8"/>
    <!-- Leaf -->
    <path d="M 0,-14 Q 8,-20 8,-12 Q 4,-10 0,-14" fill="#22c55e"/>
  </g>
</svg>