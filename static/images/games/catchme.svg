<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="cm-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#141c33"/>
    </linearGradient>
    <linearGradient id="cm-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8c00"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="cm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="220" fill="url(#cm-bg)"/>
  <!-- Target Grid / Crosshair background -->
  <circle cx="200" cy="110" r="90" fill="rgba(255,140,0,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="200" cy="110" r="45" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="90" y1="110" x2="310" y2="110" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="200" y1="15" x2="200" y2="205" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Cyber Stopwatch Body -->
  <g filter="url(#cm-glow)">
    <!-- Top Stopwatch Crown/Button -->
    <rect x="192" y="16" width="16" height="12" rx="3" fill="#fbbf24"/>
    <rect x="195" y="12" width="10" height="4" rx="2" fill="#f59e0b"/>
    <!-- Outer Track Circle -->
    <circle cx="200" cy="115" r="70" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="8"/>
    <!-- Progress Glowing Ring (3/4 filled) -->
    <circle cx="200" cy="115" r="70" fill="none" stroke="url(#cm-ring)" stroke-width="8" stroke-linecap="round" stroke-dasharray="350 440" transform="rotate(-90 200 115)"/>
  </g>
  <!-- Digital Clock Face Inside -->
  <g filter="url(#cm-glow)" text-anchor="middle">
    <!-- TARGET Label -->
    <text x="200" y="98" fill="#94a3b8" font-family="'Inter', sans-serif" font-weight="700" font-size="10" letter-spacing="2">TARGET TIME</text>
    <!-- 10.00s Clock -->
    <text x="200" y="130" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="28" letter-spacing="1">10.00s</text>
  </g>
  <!-- Spark Particles -->
  <g fill="#ff8c00" opacity="0.8">
    <circle cx="140" cy="55" r="2.5"/>
    <circle cx="265" cy="62" r="3"/>
    <circle cx="275" cy="165" r="2"/>
    <circle cx="130" cy="150" r="2.5"/>
  </g>
</svg>