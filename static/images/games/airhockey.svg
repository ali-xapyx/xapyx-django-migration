<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="ah-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="100%" stop-color="#0e172a"/>
    </linearGradient>
    <filter id="ah-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="220" fill="url(#ah-bg)"/>
  <!-- Hockey Rink Table -->
  <rect x="25" y="20" width="350" height="180" rx="20" fill="#0b1329" stroke="rgba(56,189,248,0.3)" stroke-width="3"/>
  <!-- Center Ice Dividing Line & Circle -->
  <line x1="200" y1="20" x2="200" y2="200" stroke="#ef4444" stroke-width="3" stroke-dasharray="10,6" opacity="0.75"/>
  <circle cx="200" cy="110" r="35" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.6"/>
  <!-- Goal lines -->
  <path d="M 25,75 A 35,35 0 0,1 25,145" fill="none" stroke="#ef4444" stroke-width="3" opacity="0.6"/>
  <path d="M 375,75 A 35,35 0 0,0 375,145" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.6"/>
  <!-- Red Striker (Mallet) Left -->
  <g transform="translate(105, 110)" filter="url(#ah-glow)">
    <circle cx="0" cy="0" r="28" fill="#b91c1c" stroke="#f87171" stroke-width="3"/>
    <circle cx="0" cy="0" r="16" fill="#ef4444" stroke="#fca5a5" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#fecaca"/>
  </g>
  <!-- Blue Striker (Mallet) Right -->
  <g transform="translate(295, 110)" filter="url(#ah-glow)">
    <circle cx="0" cy="0" r="28" fill="#0369a1" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="0" cy="0" r="16" fill="#0284c7" stroke="#7dd3fc" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#bae6fd"/>
  </g>
  <!-- High Speed Cyan Puck in Motion -->
  <g filter="url(#ah-glow)">
    <!-- Motion trails -->
    <line x1="160" y1="104" x2="215" y2="108" stroke="#00f0ff" stroke-width="6" opacity="0.3" stroke-linecap="round"/>
    <line x1="180" y1="106" x2="215" y2="108" stroke="#fff" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
    <!-- Puck -->
    <circle cx="225" cy="108" r="13" fill="#00f0ff" stroke="#fff" stroke-width="2.5"/>
  </g>
</svg>