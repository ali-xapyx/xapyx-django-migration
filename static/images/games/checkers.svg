<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="chk-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#141a29"/>
    </linearGradient>
    <radialGradient id="chk-red-piece" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
    <radialGradient id="chk-cyan-piece" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>
    <filter id="chk-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="220" fill="url(#chk-bg)"/>
  <!-- Perspective Checkerboard -->
  <g transform="translate(200, 115) rotate(-15) skewX(20) scale(0.95)" stroke="rgba(255,255,255,0.08)" stroke-width="1">
    <!-- Board Base -->
    <rect x="-140" y="-80" width="280" height="160" rx="12" fill="#0f172a" stroke="rgba(99,102,241,0.4)" stroke-width="2"/>
    <!-- Grid squares -->
    <g fill="#1e293b">
      <rect x="-130" y="-70" width="32" height="32" fill="#334155"/>
      <rect x="-66" y="-70" width="32" height="32" fill="#334155"/>
      <rect x="-2" y="-70" width="32" height="32" fill="#334155"/>
      <rect x="62" y="-70" width="32" height="32" fill="#334155"/>
      <rect x="-98" y="-38" width="32" height="32" fill="#334155"/>
      <rect x="-34" y="-38" width="32" height="32" fill="#334155"/>
      <rect x="30" y="-38" width="32" height="32" fill="#334155"/>
      <rect x="94" y="-38" width="32" height="32" fill="#334155"/>
      <rect x="-130" y="-6" width="32" height="32" fill="#334155"/>
      <rect x="-66" y="-6" width="32" height="32" fill="#334155"/>
      <rect x="-2" y="-6" width="32" height="32" fill="#334155"/>
      <rect x="62" y="-6" width="32" height="32" fill="#334155"/>
      <rect x="-98" y="26" width="32" height="32" fill="#334155"/>
      <rect x="-34" y="26" width="32" height="32" fill="#334155"/>
      <rect x="30" y="26" width="32" height="32" fill="#334155"/>
      <rect x="94" y="26" width="32" height="32" fill="#334155"/>
    </g>
  </g>
  <!-- Hero King Checkers Piece (Red Crowned King) -->
  <g transform="translate(145, 110)" filter="url(#chk-glow)">
    <!-- Piece shadow -->
    <ellipse cx="0" cy="24" rx="36" ry="14" fill="rgba(0,0,0,0.6)"/>
    <!-- Piece Body -->
    <ellipse cx="0" cy="10" rx="34" ry="16" fill="#991b1b"/>
    <ellipse cx="0" cy="0" rx="34" ry="16" fill="url(#chk-red-piece)" stroke="#f87171" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="24" ry="11" fill="none" stroke="#fca5a5" stroke-width="1.5"/>
    <!-- Crown Emblem -->
    <path d="M -12,-3 L -6,4 L 0,-6 L 6,4 L 12,-3 L 10,7 L -10,7 Z" fill="#fde047" stroke="#ca8a04" stroke-width="1"/>
  </g>
  <!-- Cyan Checkers Piece -->
  <g transform="translate(255, 100)" filter="url(#chk-glow)">
    <ellipse cx="0" cy="22" rx="32" ry="13" fill="rgba(0,0,0,0.5)"/>
    <ellipse cx="0" cy="8" rx="30" ry="14" fill="#075985"/>
    <ellipse cx="0" cy="0" rx="30" ry="14" fill="url(#chk-cyan-piece)" stroke="#38bdf8" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="20" ry="9" fill="none" stroke="#7dd3fc" stroke-width="1.5"/>
  </g>
  <!-- Motion Jump Arc -->
  <path d="M 175,95 Q 200,45 225,90" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6,4" opacity="0.85"/>
</svg>