<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="lm-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#19041b"/>
      <stop offset="100%" stop-color="#340628"/>
    </linearGradient>
    <linearGradient id="lm-heart-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff2a6d"/>
      <stop offset="100%" stop-color="#ff758c"/>
    </linearGradient>
    <filter id="lm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="220" fill="url(#lm-bg)"/>
  <!-- Ambient Hearts in Background -->
  <g fill="rgba(255,105,180,0.15)">
    <path d="M 60,45 A 8,8 0 0,0 46,55 Q 60,75 60,75 Q 60,75 74,55 A 8,8 0 0,0 60,45 Z"/>
    <path d="M 340,55 A 10,10 0 0,0 322,67 Q 340,92 340,92 Q 340,92 358,67 A 10,10 0 0,0 340,55 Z"/>
    <path d="M 70,165 A 9,9 0 0,0 54,177 Q 70,200 70,200 Q 70,200 86,177 A 9,9 0 0,0 70,165 Z"/>
  </g>
  <!-- ECG Heartbeat Pulse Line -->
  <path d="M 10,110 L 110,110 L 125,75 L 140,145 L 155,90 L 170,125 L 180,110 L 390,110" fill="none" stroke="#ff2a6d" stroke-width="2.5" opacity="0.45"/>
  <!-- Twin Glowing Interlocking Hearts -->
  <g filter="url(#lm-glow)">
    <!-- Primary Big Heart -->
    <path d="M 175,70 A 24,24 0 0,0 135,95 Q 175,150 175,150 Q 175,150 215,95 A 24,24 0 0,0 175,70 Z" fill="url(#lm-heart-grad)" stroke="#ffb3c1" stroke-width="2.5"/>
    <!-- Intersecting Golden Heart -->
    <path d="M 225,65 A 20,20 0 0,0 192,86 Q 225,135 225,135 Q 225,135 258,86 A 20,20 0 0,0 225,65 Z" fill="none" stroke="#fde047" stroke-width="3.5" opacity="0.85"/>
  </g>
  <!-- 98% Compatibility Gauge Badge -->
  <g transform="translate(200, 172)" filter="url(#lm-glow)">
    <rect x="-65" y="-18" width="130" height="36" rx="18" fill="rgba(255,42,109,0.3)" stroke="#ff2a6d" stroke-width="2"/>
    <text x="0" y="6" fill="#fff" font-family="'Inter', sans-serif" font-weight="900" font-size="18" text-anchor="middle" letter-spacing="1">98% LOVE</text>
  </g>
</svg>