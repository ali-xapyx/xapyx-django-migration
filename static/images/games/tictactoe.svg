<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="ttt-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a20"/>
      <stop offset="100%" stop-color="#16082b"/>
    </linearGradient>
    <filter id="ttt-glow-gold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="ttt-glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="ttt-glow-line" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="220" fill="url(#ttt-bg)"/>
  <!-- Ambient Grid Floor Glow -->
  <ellipse cx="200" cy="115" rx="170" ry="85" fill="rgba(139,92,246,0.12)"/>
  <!-- Grid Lines (3x3) -->
  <g stroke="rgba(139,92,246,0.45)" stroke-width="5" stroke-linecap="round">
    <line x1="160" y1="28" x2="160" y2="192"/>
    <line x1="240" y1="28" x2="240" y2="192"/>
    <line x1="85" y1="82" x2="315" y2="82"/>
    <line x1="85" y1="138" x2="315" y2="138"/>
  </g>
  <!-- Symbols -->
  <!-- Top Left: Gold X -->
  <g filter="url(#ttt-glow-gold)" stroke="#ffb703" stroke-width="8" stroke-linecap="round">
    <line x1="108" y1="44" x2="138" y2="68"/>
    <line x1="138" y1="44" x2="108" y2="68"/>
  </g>
  <!-- Center: Gold X -->
  <g filter="url(#ttt-glow-gold)" stroke="#ffb703" stroke-width="9" stroke-linecap="round">
    <line x1="184" y1="96" x2="216" y2="124"/>
    <line x1="216" y1="96" x2="184" y2="124"/>
  </g>
  <!-- Bottom Right: Gold X (Winning line) -->
  <g filter="url(#ttt-glow-gold)" stroke="#ffb703" stroke-width="8" stroke-linecap="round">
    <line x1="262" y1="152" x2="292" y2="178"/>
    <line x1="292" y1="152" x2="262" y2="178"/>
  </g>
  <!-- Top Center: Cyan O -->
  <g filter="url(#ttt-glow-cyan)">
    <circle cx="200" cy="55" r="16" fill="none" stroke="#00f0ff" stroke-width="7"/>
  </g>
  <!-- Middle Left: Cyan O -->
  <g filter="url(#ttt-glow-cyan)">
    <circle cx="122" cy="110" r="16" fill="none" stroke="#00f0ff" stroke-width="7"/>
  </g>
  <!-- Winning Diagonal Laser Line -->
  <g filter="url(#ttt-glow-line)">
    <line x1="90" y1="30" x2="310" y2="190" stroke="#f43f5e" stroke-width="5" stroke-linecap="round"/>
    <line x1="90" y1="30" x2="310" y2="190" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>