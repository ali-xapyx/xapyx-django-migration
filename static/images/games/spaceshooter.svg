<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="ss-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050516"/>
      <stop offset="50%" stop-color="#0d0928"/>
      <stop offset="100%" stop-color="#180e38"/>
    </linearGradient>
    <radialGradient id="ss-nebula" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(139,92,246,0.35)"/>
      <stop offset="50%" stop-color="rgba(236,72,153,0.15)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="ss-ship" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="ss-laser" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>
    <filter id="ss-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="220" fill="url(#ss-bg)"/>
  <rect width="400" height="220" fill="url(#ss-nebula)"/>
  <!-- Stars -->
  <g fill="#fff" opacity="0.8">
    <circle cx="35" cy="25" r="1.2"/>
    <circle cx="75" cy="80" r="1.5" opacity="0.6"/>
    <circle cx="120" cy="35" r="1"/>
    <circle cx="160" cy="110" r="1.8" fill="#ffd166"/>
    <circle cx="210" cy="45" r="1.2"/>
    <circle cx="260" cy="90" r="1.5"/>
    <circle cx="310" cy="30" r="2" fill="#a5f3fc"/>
    <circle cx="360" cy="70" r="1"/>
    <circle cx="50" cy="160" r="1.3"/>
    <circle cx="95" cy="190" r="1"/>
    <circle cx="340" cy="175" r="1.5" fill="#fbcfe8"/>
    <circle cx="375" cy="140" r="1.2"/>
  </g>
  <!-- Distant Alien Cruisers -->
  <g filter="url(#ss-glow)">
    <polygon points="110,48 125,56 120,62 100,62 95,56" fill="#ef4444" opacity="0.85"/>
    <circle cx="110" cy="56" r="3" fill="#fecaca"/>
    <polygon points="280,38 300,48 292,56 268,56 260,48" fill="#ef4444" opacity="0.85"/>
    <circle cx="280" cy="48" r="3.5" fill="#fecaca"/>
  </g>
  <!-- Twin Lasers -->
  <g filter="url(#ss-glow)">
    <line x1="184" y1="125" x2="184" y2="40" stroke="url(#ss-laser)" stroke-width="4" stroke-linecap="round"/>
    <line x1="216" y1="125" x2="216" y2="40" stroke="url(#ss-laser)" stroke-width="4" stroke-linecap="round"/>
    <!-- Laser Sparks -->
    <circle cx="184" cy="42" r="5" fill="#a5f3fc"/>
    <circle cx="216" cy="42" r="5" fill="#a5f3fc"/>
  </g>
  <!-- Hero Starfighter -->
  <g filter="url(#ss-glow)">
    <!-- Engine Flare -->
    <polygon points="194,188 200,212 206,188" fill="#38bdf8"/>
    <polygon points="196,188 200,204 204,188" fill="#fff"/>
    <!-- Ship Body -->
    <path d="M 200,105 L 218,155 L 236,170 L 222,175 L 214,168 L 206,186 L 194,186 L 186,168 L 178,175 L 164,170 L 182,155 Z" fill="url(#ss-ship)" stroke="#ffedd5" stroke-width="1.5"/>
    <!-- Cockpit -->
    <ellipse cx="200" cy="142" rx="4.5" ry="12" fill="#38bdf8"/>
    <ellipse cx="200" cy="140" rx="2" ry="6" fill="#fff" opacity="0.8"/>
    <!-- Wing Cannons -->
    <rect x="171" y="145" width="3" height="16" rx="1.5" fill="#fdba74"/>
    <rect x="226" y="145" width="3" height="16" rx="1.5" fill="#fdba74"/>
  </g>
</svg>